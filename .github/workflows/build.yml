name: Build APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Cordova and ImageMagick
      run: |
        npm install -g cordova cordova-res
        sudo apt-get update && sudo apt-get install -y imagemagick

    - name: Create Cordova Project and Copy Files
      run: |
        # هنا الاسم (نصر الله) بدون رقم 1
        cordova create cordova-app com.moosa.arty "نصر الله"
        cd cordova-app
        cordova platform add android
        rm -rf www/*
        cp ../index.html www/
        cp ../app.js www/
        cp ../style.css www/
        
        # تجهيز الأيقونة وشاشة البداية
        mkdir -p resources
        # تحويل الصورة إلى PNG حقيقية بمقاس 1024
        convert ../icon.png -resize 1024x1024! resources/icon.png
        # إنشاء شاشة بداية بيضاء وهمية لكي لا تفشل الأداة
        convert -size 2732x2732 xc:white resources/splash.png
        
        # توليد الأيقونات
        cordova-res android --skip-config --copy

    - name: Setup Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 --decode > my-release-key.jks
        cat <<EOF > cordova-app/build.json
        {
          "android": {
            "release": {
              "keystore": "../my-release-key.jks",
              "storePassword": "123456",
              "alias": "my-key",
              "password": "123456"
            }
          }
        }
        EOF

    - name: Build APK
      run: |
        cd cordova-app
        cordova build android --release --buildConfig build.json -- --packageType=apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-signed
        path: cordova-app/platforms/android/app/build/outputs/apk/release/*.apk
        if-no-files-found: error