name: Build APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Cordova Project and Copy Files
      run: |
        cordova create cordova-app com.moosa.arty ArtyApp
        cd cordova-app
        cordova platform add android
        rm -rf www/*
        cp ../index.html www/
        cp ../app.js www/
        cp ../style.css www/
        cp ../icon.png www/

    - name: Setup Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 --decode > my-release-key.jks
        cat <<EOF > cordova-app/build.json
        {
          "android": {
            "release": {
              "keystore": "../my-release-key.jks",
              "storePassword": "123456",
              "alias": "my-key",
              "password": "123456"
            }
          }
        }
        EOF

    - name: Build APK
      run: |
        cd cordova-app
        cordova build android --release --buildConfig build.json

    - name: Find and Copy APK
      run: |
        echo "Searching for the generated APK..."
        find . -name "*.apk" -type f
        find . -name "*.apk" -type f -exec cp {} ./app-release.apk \;
        ls -la

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-signed
        path: app-release.apk
        if-no-files-found: error