name: Build APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Cordova and Tools
      run: npm install -g cordova cordova-res

    - name: Create Project and Setup Icon
      run: |
        # 1. نستخدم اسم إنجليزي لتجنب مشاكل الترميز، وسنغيره لاحقاً
        cordova create cordova-app com.moosa.arty "Nasrallah"
        cd cordova-app
        cordova platform add android
        
        # 2. نسخ ملفات الويب
        rm -rf www/*
        cp ../index.html www/
        cp ../app.js www/
        cp ../style.css www/
        
        # 3. تجهيز الأيقونة الخاصة بك
        mkdir -p resources
        cp ../icon.png resources/icon.png
        # نستخدم نفس الصورة كشاشة بداية لكي لا يفشل البناء
        cp ../icon.png resources/splash.png
        
        # 4. توليد الأيقونات
        cordova-res android --skip-config --copy
        
        # 5. تغيير اسم التطبيق المكتوب على الهاتف إلى "نصر الله ١"
        sed -i 's/<name>Nasrallah<\/name>/<name>نصر الله ١<\/name>/g' config.xml
        sed -i 's/<name>Nasrallah<\/name>/<name>نصر الله ١<\/name>/g' platforms/android/app/src/main/res/values/strings.xml

    - name: Setup Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 --decode > my-release-key.jks
        cat <<EOF > cordova-app/build.json
        {
          "android": {
            "release": {
              "keystore": "../my-release-key.jks",
              "storePassword": "123456",
              "alias": "my-key",
              "password": "123456"
            }
          }
        }
        EOF

    - name: Build APK
      run: |
        cd cordova-app
        cordova build android --release --buildConfig build.json -- --packageType=apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-signed
        path: cordova-app/platforms/android/app/build/outputs/apk/release/*.apk
        if-no-files-found: error