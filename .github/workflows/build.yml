name: Build APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Cordova and Tools
      run: |
        npm install -g cordova cordova-res
        sudo apt-get update
        sudo apt-get install -y imagemagick

    - name: Create Project and Setup App
      run: |
        # 1. إنشاء المشروع
        cordova create cordova-app com.moosa.arty ArtyApp
        cd cordova-app
        cordova platform add android
        
        # 2. نسخ ملفات الويب
        rm -rf www/*
        cp ../index.html www/
        cp ../app.js www/
        cp ../style.css www/
        
        # 3. تجهيز الصورة وتكبيرها لتناسب شاشة البداية
        mkdir -p resources
        cp ../icon.png resources/icon.png
        # هنا نقوم بتكبير الصورة إلى 1920x1920 لتلبية متطلبات شاشة البداية
        convert ../icon.png -resize 1920x1920! resources/splash.png
        
        # 4. تعديل ملف config.xml برمجياً لإضافة الأيقونة والاسم
        node -e "
          const fs = require('fs');
          let c = fs.readFileSync('config.xml', 'utf8');
          c = c.replace(/<name>.*?<\/name>/, '<name>نصر الله ١</name>');
          c = c.replace(/<icon[^>]*>/g, '');
          c = c.replace('</widget>', '    <icon src=\"resources/icon.png\" />\n</widget>');
          fs.writeFileSync('config.xml', c);
        "
        
        # 5. توليد الأيقونات (هذه المرة ستنجح لأن الصورة بالحجم المطلوب)
        cordova-res android --skip-config --copy

    - name: Setup Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 --decode > my-release-key.jks

    - name: Build APK
      run: |
        cd cordova-app
        cordova build android --release -- --keystore=../my-release-key.jks --storePassword=123456 --alias=my-key --password=123456 --packageType=apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-signed
        path: cordova-app/platforms/android/app/build/outputs/apk/release/*.apk
        if-no-files-found: error