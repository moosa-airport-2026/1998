name: Build APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Cordova and ImageMagick
      run: |
        npm install -g cordova
        sudo apt-get update
        sudo apt-get install -y imagemagick

    - name: Create Project and Setup App
      run: |
        # 1. إنشاء المشروع
        cordova create cordova-app com.moosa.arty ArtyApp
        cd cordova-app
        cordova platform add android
        
        # 2. نسخ ملفات الويب
        rm -rf www/*
        cp ../index.html www/
        cp ../app.js www/
        cp ../style.css www/
        
        # 3. تغيير الاسم إلى "نصر الله ١"
        node -e "const fs=require('fs'); let c=fs.readFileSync('config.xml','utf8'); c=c.replace(/<name>.*?<\/name>/, '<name>نصر الله ١</name>'); fs.writeFileSync('config.xml', c);"
        
        # 4. تجهيز الملفات
        cordova prepare android

    - name: Force Custom Icon Override
      run: |
        cd cordova-app
        RES="platforms/android/app/src/main/res"
        
        # الحل الجذري: مسح كل مجلدات الأيقونات القديمة (بما فيها التكيفية)
        rm -rf $RES/mipmap-anydpi-v26
        rm -rf $RES/mipmap-mdpi
        rm -rf $RES/mipmap-hdpi
        rm -rf $RES/mipmap-xhdpi
        rm -rf $RES/mipmap-xxhdpi
        rm -rf $RES/mipmap-xxxhdpi
        
        # إعادة إنشاء المجلدات ووضع صورتك فيها
        mkdir -p $RES/mipmap-mdpi $RES/mipmap-hdpi $RES/mipmap-xhdpi $RES/mipmap-xxhdpi $RES/mipmap-xxxhdpi
        
        if [ -f ../icon.png ]; then
          echo "Applying custom icon..."
          convert ../icon.png -resize 48x48! $RES/mipmap-mdpi/ic_launcher.png
          convert ../icon.png -resize 72x72! $RES/mipmap-hdpi/ic_launcher.png
          convert ../icon.png -resize 96x96! $RES/mipmap-xhdpi/ic_launcher.png
          convert ../icon.png -resize 144x144! $RES/mipmap-xxhdpi/ic_launcher.png
          convert ../icon.png -resize 192x192! $RES/mipmap-xxxhdpi/ic_launcher.png
          
          # نسخ الصورة للأيقونة المستديرة أيضاً
          convert ../icon.png -resize 192x192! $RES/mipmap-xxxhdpi/ic_launcher_round.png
        fi

    - name: Setup Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 --decode > my-release-key.jks

    - name: Build APK
      run: |
        cd cordova-app
        cordova build android --release -- --keystore=../my-release-key.jks --storePassword=123456 --alias=my-key --password=123456 --packageType=apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-signed
        path: cordova-app/platforms/android/app/build/outputs/apk/release/*.apk
        if-no-files-found: error