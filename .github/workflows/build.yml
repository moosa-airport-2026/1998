name: Build APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Cordova
      run: npm install -g cordova cordova-res

    - name: Create Project and Copy Files
      run: |
        # 1. إنشاء المشروع باسم إنجليزي لتجنب مشاكل الترميز
        cordova create cordova-app com.moosa.arty ArtyApp
        cd cordova-app
        cordova platform add android
        
        # 2. نسخ ملفات الويب
        rm -rf www/*
        cp ../index.html www/
        cp ../app.js www/
        cp ../style.css www/
        
        # 3. تغيير اسم التطبيق إلى "نصر الله ١" باستخدام Node.js (طريقة آمنة 100%)
        node -e "const fs=require('fs'); let c=fs.readFileSync('config.xml','utf8'); c=c.replace(/<name>.*?<\/name>/, '<name>نصر الله ١</name>'); fs.writeFileSync('config.xml', c);"
        
        # 4. تجهيز الأيقونة (نسخ صورتك كأيقونة وشاشة بداية)
        mkdir -p resources
        cp ../icon.png resources/icon.png
        cp ../icon.png resources/splash.png
        
        # 5. توليد الأيقونات
        cordova-res android --skip-config --copy
        
        # 6. تحديث ملفات الأندرويد ليأخذ الاسم الجديد
        cordova prepare android

    - name: Setup Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 --decode > my-release-key.jks
        cat <<EOF > cordova-app/build.json
        {
          "android": {
            "release": {
              "keystore": "../my-release-key.jks",
              "storePassword": "123456",
              "alias": "my-key",
              "password": "123456"
            }
          }
        }
        EOF

    - name: Build APK
      run: |
        cd cordova-app
        cordova build android --release --buildConfig build.json -- --packageType=apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-signed
        path: cordova-app/platforms/android/app/build/outputs/apk/release/*.apk
        if-no-files-found: error