name: Build APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Cordova and ImageMagick
      run: |
        npm install -g cordova
        sudo apt-get update && sudo apt-get install -y imagemagick

    - name: Create Cordova Project and Apply Icon
      run: |
        # 1. إنشاء المشروع بالاسم المطلوب
        cordova create cordova-app com.moosa.arty "نصر الله ١"
        cd cordova-app
        cordova platform add android
        
        # 2. نسخ ملفات التطبيق
        rm -rf www/*
        cp ../index.html www/
        cp ../app.js www/
        cp ../style.css www/
        
        # 3. الحل الجذري للأيقونة: استبدال ملفات الأيقونة مباشرة داخل الأندرويد
        RES_DIR="platforms/android/app/src/main/res"
        
        # التأكد من وجود صورة icon.png في المشروع
        if [ -f ../icon.png ]; then
          convert ../icon.png -resize 48x48! $RES_DIR/mipmap-mdpi/ic_launcher.png
          convert ../icon.png -resize 72x72! $RES_DIR/mipmap-hdpi/ic_launcher.png
          convert ../icon.png -resize 96x96! $RES_DIR/mipmap-xhdpi/ic_launcher.png
          convert ../icon.png -resize 144x144! $RES_DIR/mipmap-xxhdpi/ic_launcher.png
          convert ../icon.png -resize 192x192! $RES_DIR/mipmap-xxxhdpi/ic_launcher.png
          echo "✅ تم استبدال الأيقونات بنجاح."
        else
          echo "⚠️ لم يتم العثور على ملف icon.png، سيتم استخدام الأيقونة الافتراضية."
        fi

    - name: Setup Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 --decode > my-release-key.jks
        cat <<EOF > cordova-app/build.json
        {
          "android": {
            "release": {
              "keystore": "../my-release-key.jks",
              "storePassword": "123456",
              "alias": "my-key",
              "password": "123456"
            }
          }
        }
        EOF

    - name: Build APK
      run: |
        cd cordova-app
        cordova build android --release --buildConfig build.json -- --packageType=apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-signed
        path: cordova-app/platforms/android/app/build/outputs/apk/release/*.apk
        if-no-files-found: error