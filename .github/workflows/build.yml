name: Build APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Handle Keystore (Generate or Decode)
      id: keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "⏳ Secret is missing. Generating a new keystore..."
          keytool -genkey -v -keystore my-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-key -storepass 123456 -keypass 123456 -dname "CN=ArtyApp"
          base64 my-release-key.jks > keystore_base64.txt
          echo "generate=true" >> $GITHUB_OUTPUT
        else
          echo "✅ Secret found. Decoding it..."
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > my-release-key.jks
          echo "generate=false" >> $GITHUB_OUTPUT
        fi

    - name: Upload generated keystore
      if: steps.keystore.outputs.generate == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: keystore-base64-file
        path: keystore_base64.txt

    - name: Stop if secret is missing
      if: steps.keystore.outputs.generate == 'true'
      run: |
        echo "=========================================================="
        echo "تم إنشاء المفتاح بنجاح."
        echo "يرجى النزول لأسفل الصفحة، وتحميل الملف keystore-base64-file"
        echo "افتح الملف، وانسخ النص بالكامل، وضعه في Secret باسم KEYSTORE_BASE64 ثم شغل البناء من جديد."
        echo "=========================================================="
        exit 1

    - name: Build and Sign APK
      if: steps.keystore.outputs.generate == 'false'
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=$(pwd)/my-release-key.jks \
          -Pandroid.injected.signing.store.password=123456 \
          -Pandroid.injected.signing.key.alias=my-key \
          -Pandroid.injected.signing.key.password=123456

    - name: Upload APK
      if: steps.keystore.outputs.generate == 'false'
      uses: actions/upload-artifact@v4
      with:
        name: app-release-signed
        path: app/build/outputs/apk/release/app-release.apk
